# 通用配置
project: vlm-vla-voice-arm
seed: 42

robot:
  dof: 6
  cameras: [front, wrist]      # 相机名，训练与推理必须一致
  control_hz: 30
  image_size: [480, 640]
  gripper_range: [0.0, 1.0]    # 0=闭合 1=张开

vlm:
  provider: deepseek
  model: deepseek-flash
  base_url: https://api.deepseek.com
  timeout_s: 15
  max_retries: 1
  confidence_threshold: 0.6

policy:
  type: act                    # act | smolvla
  action_chunk: 16
  device: cuda

audio:
  wakeword: openWakeWord
  asr: sensevoice-small
  tts: edge-tts
  language: zh-CN

state_machine:
  timeouts_s:
    listening: 8
    thinking: 15
    confirming: 10
    executing: 30
    feedback: 5
