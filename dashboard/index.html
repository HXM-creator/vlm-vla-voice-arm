<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voice-arm 训练看板</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --line: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --ok: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 20px 60px;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  header { margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0 0 6px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600; margin-left: 8px; vertical-align: 2px;
  }
  .badge.ok { background: rgba(63,185,80,.15); color: var(--ok); border: 1px solid rgba(63,185,80,.4); }
  .badge.warn { background: rgba(210,153,34,.15); color: var(--warn); border: 1px solid rgba(210,153,34,.4); }
  .badge.bad { background: rgba(248,81,73,.15); color: var(--bad); border: 1px solid rgba(248,81,73,.4); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card .k { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .card .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  section { margin-bottom: 32px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; color: var(--text); }
  h2 small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  svg { display: block; width: 100%; height: auto; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.num { font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>voice-arm 训练看板 <span id="verdict"></span></h1>
    <div class="sub" id="meta">等待 data.js…</div>
  </header>

  <div class="cards" id="cards"></div>

  <section id="videoSection" style="display:none">
    <h2>仿真回放 <small>左：front_cam　右：wrist_cam</small></h2>
    <div class="panel">
      <video id="rollout" controls loop muted playsinline
             style="width:100%;border-radius:6px;background:#000"></video>
      <div class="hint">由 scripts/render_replay_video.py 生成（outputs/replay/rollout.mp4）。</div>
    </div>
  </section>

  <section>
    <h2>关节动作曲线 <small>来自 outputs/replay/replay.npz</small></h2>
    <div class="panel">
      <div id="actionChart"></div>
      <div class="legend" id="actionLegend"></div>
    </div>
  </section>

  <section>
    <h2>语言条件对比 <small>不同指令在同一初始状态下产生的动作差异</small></h2>
    <div class="panel">
      <div id="normChart"></div>
      <div class="hint">柱高 = 该指令的动作范数均值；若全部接近 0 说明策略未加载。</div>
    </div>
    <div class="panel" style="margin-top:12px">
      <div id="distChart"></div>
      <div class="legend" id="distLegend"></div>
      <div class="hint">逐帧动作距离，虚线为判定阈值。</div>
    </div>
    <div class="panel" style="margin-top:12px">
      <table id="pairTable"></table>
    </div>
  </section>
</div>

<script src="data.js"></script>
<script>
(function () {
  const D = window.DASHBOARD || {};
  const REPLAY = D.replay || null;
  const LANG = D.lang || null;

  if (D.video) {
    const section = document.getElementById("videoSection");
    const video = document.getElementById("rollout");
    section.style.display = "";
    video.src = D.video;
  }

  const COLORS = ["#58a6ff", "#3fb950", "#d29922", "#f85149", "#bc8cff", "#39c5cf"];

  function el(tag, attrs, text) {
    const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }

  function fmt(v, d) {
    if (v == null || isNaN(v)) return "—";
    return Number(v).toFixed(d == null ? 4 : d);
  }

  function lineChart(host, series, opts) {
    opts = opts || {};
    const W = 760, H = opts.height || 260;
    const L = 52, R = 16, T = 14, B = 30;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "xMidYMid meet" });
    host.textContent = "";
    host.appendChild(svg);

    const n = series[0].values.length;
    if (!n) return;
    let min = Infinity, max = -Infinity;
    series.forEach(s => s.values.forEach(v => { if (v < min) min = v; if (v > max) max = v; }));
    if (opts.threshold != null) { min = Math.min(min, opts.threshold); max = Math.max(max, opts.threshold); }
    if (min === max) { min -= 1; max += 1; }
    const pad = (max - min) * 0.1;
    min -= pad; max += pad;

    const x = i => L + (W - L - R) * (n === 1 ? 0.5 : i / (n - 1));
    const y = v => T + (H - T - B) * (1 - (v - min) / (max - min));

    // 网格与刻度
    for (let g = 0; g <= 4; g++) {
      const v = min + (max - min) * g / 4;
      const yy = y(v);
      svg.appendChild(el("line", { x1: L, x2: W - R, y1: yy, y2: yy, stroke: "#21262d", "stroke-width": 1 }));
      svg.appendChild(el("text", { x: L - 8, y: yy + 4, fill: "#8b949e", "font-size": 11, "text-anchor": "end" }, fmt(v, 2)));
    }
    svg.appendChild(el("line", { x1: L, x2: W - R, y1: H - B, y2: H - B, stroke: "#30363d", "stroke-width": 1 }));
    svg.appendChild(el("text", { x: (L + W - R) / 2, y: H - 8, fill: "#8b949e", "font-size": 11, "text-anchor": "middle" }, opts.xLabel || "step"));

    if (opts.threshold != null) {
      svg.appendChild(el("line", {
        x1: L, x2: W - R, y1: y(opts.threshold), y2: y(opts.threshold),
        stroke: "#d29922", "stroke-width": 1, "stroke-dasharray": "5 4"
      }));
    }

    series.forEach((s, si) => {
      let d = "";
      s.values.forEach((v, i) => { d += (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1) + " "; });
      svg.appendChild(el("path", {
        d: d, fill: "none", stroke: s.color || COLORS[si % COLORS.length],
        "stroke-width": 1.6, "stroke-linejoin": "round", "stroke-linecap": "round"
      }));
    });
  }

  function legend(host, series) {
    host.textContent = "";
    series.forEach((s, i) => {
      const span = document.createElement("span");
      const dot = document.createElement("i");
      dot.style.background = s.color || COLORS[i % COLORS.length];
      span.appendChild(dot);
      span.appendChild(document.createTextNode(s.name));
      host.appendChild(span);
    });
  }

  function barChart(host, items) {
    host.textContent = "";
    if (!items.length) return;
    const W = 760, H = 200, L = 52, R = 16, T = 16, B = 46;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "xMidYMid meet" });
    host.appendChild(svg);
    const max = Math.max(...items.map(i => i.value), 0.0001);
    const slot = (W - L - R) / items.length;
    const bw = Math.min(90, slot * 0.55);
    items.forEach((it, i) => {
      const cx = L + slot * (i + 0.5);
      const h = (H - T - B) * (it.value / max);
      svg.appendChild(el("rect", {
        x: cx - bw / 2, y: H - B - h, width: bw, height: Math.max(h, 1),
        rx: 3, fill: COLORS[i % COLORS.length], opacity: 0.85
      }));
      svg.appendChild(el("text", {
        x: cx, y: H - B - h - 6, fill: "#e6edf3", "font-size": 11, "text-anchor": "middle"
      }, fmt(it.value, 3)));
      const label = it.label.length > 22 ? it.label.slice(0, 21) + "…" : it.label;
      svg.appendChild(el("text", {
        x: cx, y: H - B + 18, fill: "#8b949e", "font-size": 11, "text-anchor": "middle"
      }, label));
    });
    svg.appendChild(el("line", { x1: L, x2: W - R, y1: H - B, y2: H - B, stroke: "#30363d", "stroke-width": 1 }));
  }

  function card(k, v, hint) {
    const d = document.createElement("div");
    d.className = "card";
    d.innerHTML = `<div class="k">${k}</div><div class="v">${v}</div>` +
      (hint ? `<div class="k" style="margin-top:4px">${hint}</div>` : "");
    return d;
  }

  // ---- 顶部 ----
  const verdictEl = document.getElementById("verdict");
  if (LANG && LANG.verdict) {
    const b = document.createElement("span");
    b.className = "badge " + (LANG.verdict === "effective" ? "ok" : LANG.verdict === "no_effect" ? "bad" : "warn");
    b.textContent = LANG.verdict;
    verdictEl.appendChild(b);
  }
  const metaParts = [];
  if (REPLAY && REPLAY.summary && REPLAY.summary.checkpoint) metaParts.push("checkpoint: " + REPLAY.summary.checkpoint);
  if (LANG && LANG.timestamp) metaParts.push("语言条件: " + LANG.timestamp);
  document.getElementById("meta").textContent = metaParts.join("　·　") || "未找到数据，请先运行 scripts/export_dashboard.py";

  const cards = document.getElementById("cards");
  if (REPLAY) {
    const s = REPLAY.summary || {};
    cards.appendChild(card("回放步数", REPLAY.steps));
    cards.appendChild(card("action_std", fmt(s.action_std, 4), Number(s.action_std) > 0 ? "策略在输出动作" : "零动作回退"));
    cards.appendChild(card("mean_abs_delta", fmt(s.mean_abs_delta, 6)));
    cards.appendChild(card("actual_fps", fmt(s.actual_fps, 1)));
  }
  if (LANG && LANG.comparisons.length) {
    const means = LANG.comparisons.map(c => c.mean_distance);
    cards.appendChild(card("最小动作距离", fmt(Math.min(...means), 4), "阈值 " + fmt(LANG.threshold, 3)));
  }

  // ---- 动作曲线 ----
  if (REPLAY && REPLAY.actions.length) {
    const dof = REPLAY.actions[0].length;
    const series = [];
    for (let j = 0; j < dof; j++) {
      series.push({ name: "关节 " + (j + 1), values: REPLAY.actions.map(a => a[j]), color: COLORS[j % COLORS.length] });
    }
    lineChart(document.getElementById("actionChart"), series, { xLabel: "step（0 → " + (REPLAY.steps - 1) + "）" });
    legend(document.getElementById("actionLegend"), series);
  } else {
    document.getElementById("actionChart").innerHTML = '<div class="empty">暂无回放数据</div>';
  }

  // ---- 语言条件 ----
  if (LANG) {
    barChart(document.getElementById("normChart"),
      LANG.instructions.map((ins, i) => ({ label: ins, value: LANG.action_norms[i] || 0 })));

    const dseries = LANG.comparisons.map((c, i) => ({
      name: c.pair ? (c.pair[0] + " vs " + c.pair[1]) : ("对比 " + (i + 1)),
      values: c.per_step || [],
      color: COLORS[i % COLORS.length]
    })).filter(s => s.values.length);
    if (dseries.length) {
      lineChart(document.getElementById("distChart"), dseries, { height: 220, xLabel: "step", threshold: LANG.threshold });
      legend(document.getElementById("distLegend"), dseries);
    }

    const t = document.getElementById("pairTable");
    t.innerHTML = "<thead><tr><th>指令 A</th><th>指令 B</th><th>平均距离</th><th>最大距离</th></tr></thead>";
    const tb = document.createElement("tbody");
    LANG.comparisons.forEach(c => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${c.pair ? c.pair[0] : "—"}</td><td>${c.pair ? c.pair[1] : "—"}</td>` +
        `<td class="num">${fmt(c.mean_distance, 5)}</td><td class="num">${fmt(c.max_distance, 5)}</td>`;
      tb.appendChild(tr);
    });
    t.appendChild(tb);
  } else {
    document.getElementById("normChart").innerHTML = '<div class="empty">暂无语言条件数据</div>';
  }
})();
</script>
</body>
</html>
