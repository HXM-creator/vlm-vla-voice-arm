[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-arm"
version = "0.1.0"
description = "VLM 大脑 + VLA 小脑的中文语音控制机械臂系统"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "何佳俊" }]

dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "opencv-python>=4.8",
    "openai>=1.30",
    "requests>=2.31",
]

[project.optional-dependencies]
train = [
    "torch>=2.1",
    "torchvision>=0.16",
    "lerobot>=0.4.0",
]
audio = [
    "sounddevice>=0.4",
    "funasr>=1.1",
    "edge-tts>=6.1",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
