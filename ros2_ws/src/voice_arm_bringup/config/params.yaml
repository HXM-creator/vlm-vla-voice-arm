audio_node:
  ros__parameters:
    wakeword: openWakeWord
    asr: sensevoice-small
    tts: edge-tts

vlm_node:
  ros__parameters:
    model: deepseek-flash
    base_url: https://api.deepseek.com
    confidence_threshold: 0.6
    # 只做翻译与存在性确认，不输出坐标（见 docs/architecture.md）
    output_position_hint: true

policy_node:
  ros__parameters:
    # 留空则策略始终返回零动作（机械臂不动）。填训练产物的 pretrained_model 目录：
    #   outputs/train/<name>/checkpoints/<step>/pretrained_model
    checkpoint: outputs/train/act_smoke_retry2/checkpoints/000500/pretrained_model
    # 每批动作步数：社区实测 10 比默认 100 更稳（100 步 ≈ 3.3 秒开环执行）
    action_chunk: 10
    dof: 6

robot_node:
  ros__parameters:
    backend: sim
    dof: 6
    # 总线控制环建议 100 Hz；上报 50 Hz；上位机循环 30 Hz
    control_hz: 100
    report_hz: 50
    port: /dev/ttyACM0
    leader_port: /dev/ttyACM1
    # 相机数量一旦确定不能改，否则训练数据格式失效
    cameras: ["front", "wrist"]
    camera_front: 0
    camera_wrist: 1
    image_width: 640
    image_height: 480
    # 仿真模型路径；留空则用合成图像（空场景，不适合训练或验证抓取）
    sim_xml: ros2_ws/src/voice_arm_core/voice_arm/sim/assets/scene.xml
